name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  rust-audit:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint:boundaries
      - run: pnpm test:dogfood-redaction
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  rust-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: debug
      - name: Install native build dependencies
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev
      # tauri-build reads the frontend bundle when compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release
      - name: Install native build dependencies
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev
      # tauri-build reads the frontend bundle when compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml

  # The main ruleset requires this check name. It passes only when every
  # Linux job above succeeded (a skipped or cancelled job fails it).
  linux-wayland-beta:
    if: always()
    needs: [frontend, rust-checks, rust-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every Linux job to pass
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST_CHECKS: ${{ needs.rust-checks.result }}
          RUST_RELEASE: ${{ needs.rust-release.result }}
        run: |
          echo "frontend=$FRONTEND rust-checks=$RUST_CHECKS rust-release=$RUST_RELEASE"
          test "$FRONTEND" = success
          test "$RUST_CHECKS" = success
          test "$RUST_RELEASE" = success
