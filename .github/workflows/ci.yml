name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The core's checks: the same steps as `pnpm check`, in its order
  # (scripts/ci-check-parity.test.ts fails when they drift).
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm lint:boundaries
      - run: pnpm lint
      - run: pnpm lint:ghost-terms
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm test:workflow

  # Server conversion tripwire: plays every synthetic sample through the core's
  # gateway against the pinned Jellyfin 10.11 and 12.4 fixture. Playable samples
  # must direct play with no server job; the BluRay folder, the ISO, and a
  # forced-limit run must convert over same-origin, credential-free HLS, agree
  # with /Sessions, and leave no job after the stop. T2-09 adds Jellyscale and
  # per-device capability sets.
  tripwire:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 22.04's ffmpeg lacks libsvtav1, so the samples are generated with
      # the jellyfin-ffmpeg build that ships in the pinned fixture image.
      - name: Generate samples with jellyfin-ffmpeg
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash jellyfin/jellyfin:10.11.7 scripts/generate-samples.sh
      # The dvdsub and ISO samples need python3 and xorriso, which the Jellyfin
      # image lacks. The script skips the samples made above and builds only
      # these two on the host, with packages from the pinned Ubuntu snapshot.
      - name: Generate conversion-only samples on the host
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
        run: |
          sudo bash scripts/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades ffmpeg xorriso
          python3 --version
          bash scripts/generate-samples.sh
      - run: pnpm fixture:up
      - run: pnpm fixture:setup
      # The tripwire starts the library scan and waits for the servers to go quiet.
      - run: pnpm test:tripwire
        env:
          OCTAVE_CONVERSION_SAMPLES: "1"
      - name: Upload tripwire log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-log
          path: release-evidence/tripwire/
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: pnpm fixture:down
