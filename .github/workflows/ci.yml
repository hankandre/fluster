name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  rust-audit:
    runs-on: ubuntu-22.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint:boundaries
      - run: pnpm test:dogfood-redaction
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

  # Visual regression gate (P13-25). Compares every capture with
  # e2e/visual/baselines/; required through linux-wayland-beta. A failing run's
  # visual-captures artifact is the candidate baseline set for
  # `pnpm test:visual:accept <run-id>`.
  visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      # test:visual only writes the contact sheet when every test passes.
      - name: Build contact sheet
        if: always()
        run: node scripts/build-visual-index.mjs
      - name: Upload visual captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-captures
          path: visual-captures/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/visual-run/
          retention-days: 14
          if-no-files-found: warn

  rust-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: debug
      - name: Install native build dependencies
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev
      # tauri-build reads the frontend bundle when compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release
      - name: Install native build dependencies
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libmpv-dev
      # tauri-build reads the frontend bundle when compiling.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml

  # The main ruleset requires this check name. It passes only when every
  # Linux job above, the visual gate, and the tripwire succeeded (a skipped or cancelled job
  # fails it).
  linux-wayland-beta:
    if: always()
    needs: [frontend, rust-checks, rust-release, tripwire, visual]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every Linux job to pass
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST_CHECKS: ${{ needs.rust-checks.result }}
          RUST_RELEASE: ${{ needs.rust-release.result }}
          TRIPWIRE: ${{ needs.tripwire.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          echo "frontend=$FRONTEND rust-checks=$RUST_CHECKS rust-release=$RUST_RELEASE tripwire=$TRIPWIRE visual=$VISUAL"
          test "$FRONTEND" = success
          test "$RUST_CHECKS" = success
          test "$RUST_RELEASE" = success
          test "$TRIPWIRE" = success
          test "$VISUAL" = success

  # Server conversion tripwire (P0-04, P10-09): plays every synthetic sample
  # through the gateway against the pinned Jellyfin 10.11 and 12.4 fixture.
  # Playable samples must direct play with no server job; the BluRay folder,
  # the ISO, and a forced-limit run must convert over same-origin,
  # credential-free HLS, agree with /Sessions, and leave no job after the stop.
  # Required through linux-wayland-beta.
  tripwire:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ubuntu 22.04's ffmpeg lacks libsvtav1, so the samples are generated with
      # the jellyfin-ffmpeg build that ships in the pinned fixture image.
      - name: Generate samples with jellyfin-ffmpeg
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            -e PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --entrypoint bash jellyfin/jellyfin:10.11.7 scripts/generate-samples.sh
      # The dvdsub and ISO samples need python3 and xorriso, which the Jellyfin
      # image lacks. The script skips the samples made above and builds only
      # these two on the host (H.264 and AAC from Ubuntu's ffmpeg), with the
      # packages from the pinned Ubuntu snapshot.
      - name: Generate conversion-only samples on the host
        env:
          FLUSTER_CONVERSION_SAMPLES: "1"
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades ffmpeg xorriso
          python3 --version
          bash scripts/generate-samples.sh
      - run: pnpm fixture:up
      - run: pnpm fixture:setup
      # The tripwire starts the library scan and waits for the servers to go quiet.
      - run: pnpm test:tripwire
        env:
          FLUSTER_CONVERSION_SAMPLES: "1"
      - name: Upload tripwire log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tripwire-log
          path: release-evidence/tripwire/
          if-no-files-found: warn
      - name: Stop fixture
        if: always()
        run: pnpm fixture:down
