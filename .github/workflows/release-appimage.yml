name: release-appimage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Tauri build dependencies
        run: |
          sudo bash release/configure-ubuntu-snapshot.sh
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build and verify AppImage
        env:
          FLUSTER_DOCKER_CACHE_FROM: type=gha
          FLUSTER_DOCKER_CACHE_TO: type=gha,mode=max
        run: ./release/build-appimage.sh
      - name: Collect release evidence
        run: |
          mkdir -p release-evidence sbom-input
          mapfile -t appimages < <(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print)
          test "${#appimages[@]}" -eq 1
          appimage="${appimages[0]}"
          cp "${appimage}" release-evidence/
          cp release/components.lock release/THIRD_PARTY_NOTICES.md release-evidence/
          cp src-tauri/resources/media-libraries.txt src-tauri/resources/mpv-version.txt release-evidence/
          tar -C src-tauri/resources -czf release-evidence/media-licenses.tar.gz licenses
          appimage_name="$(basename "${appimage}")"
          (cd release-evidence && sha256sum "${appimage_name}" > "${appimage_name}.sha256")
          (cd sbom-input && "${GITHUB_WORKSPACE}/${appimage}" --appimage-extract >/dev/null)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-input/squashfs-root
          format: spdx-json
          output-file: release-evidence/fluster.spdx.json
          upload-artifact: false
      - name: Attest release provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-evidence/*.AppImage
            release-evidence/fluster.spdx.json
      - name: Save provenance bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "${PROVENANCE_BUNDLE}" release-evidence/fluster-provenance.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fluster-x86_64-appimage
          path: release-evidence/
          if-no-files-found: error
